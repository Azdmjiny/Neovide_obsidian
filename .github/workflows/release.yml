name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: |
          node -e 'const fs = require("node:fs"); const version = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version; const tag = process.env.GITHUB_REF_NAME; if (tag !== version || !/^\d+\.\d+\.\d+$/.test(tag)) { console.error(`Tag ${tag} must match manifest version ${version}`); process.exit(1); }'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft main.js manifest.json styles.css
